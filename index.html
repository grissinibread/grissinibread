<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Alejandro Navarro's portolio.">
    <meta name="keywords" content="alejandro, navarro, portfolio">
    <meta name="author" content="Alejandro Navarro">
    <link rel="icon" type="image/svg+xml" href="/bread.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800&family=Inter:wght@500;600&display=swap" rel="stylesheet">
    <script>
      // Apply the saved color theme before first paint (see src/components/data/Themes.ts).
      try {
        var t = JSON.parse(localStorage.getItem("page-theme"));
        if (t) {
          var s = document.documentElement.style;
          s.setProperty("--page-bg", t.bg);
          s.setProperty("--page-fg", t.fg);
          s.setProperty("--page-accent", t.accent);
          s.setProperty("--page-on-accent", t.onAccent);
        }
      } catch (e) {}
    </script>
    <title>alejandro navarro portfolio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
